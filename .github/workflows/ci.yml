name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # O gitleaks-action lista os commits do PR; sem isto dá 403.
  pull-requests: read

jobs:
  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Segredos no código e no histórico. Gratuito para contas pessoais.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Análise estática (SAST), agnóstica de linguagem.
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --error --metrics=off

      # Vulnerabilidades conhecidas em dependências e arquivos de configuração.
      - name: Trivy
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed /src

  checagem:
    name: Checagem do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # restic para o teste de integração do banco (o ShellCheck já vem no runner).
      - name: Instalar restic
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Instalar pnpm e dependências do painel
        run: npm install -g pnpm@12.6.0 && pnpm --dir painel install --frozen-lockfile
      - name: scripts/check.sh
        env:
          CHECK_INTEGRACAO: "1"
        run: bash scripts/check.sh

  e2e:
    name: E2E do painel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Instalar pnpm, dependências e Chromium
        run: |
          npm install -g pnpm@12.6.0
          pnpm --dir painel install --frozen-lockfile
          pnpm --dir painel exec playwright install --with-deps chromium
      # Sobe o banco e o painel em containers (infra/painel/compose.yml) e roda o Playwright.
      - name: scripts/teste-e2e.sh
        env:
          CI: "true"
        run: bash scripts/teste-e2e.sh
