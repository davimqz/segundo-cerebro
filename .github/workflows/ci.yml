name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # O gitleaks-action lista os commits do PR; sem isto dá 403.
  pull-requests: read

jobs:
  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Segredos no código e no histórico. Gratuito para contas pessoais.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Análise estática (SAST), agnóstica de linguagem.
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --error --metrics=off

      # Vulnerabilidades conhecidas em dependências e arquivos de configuração.
      - name: Trivy
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed /src

  checagem:
    name: Checagem do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Configure aqui a stack do projeto (ver perfis/ no repositório asttra-engenharia).
      - name: scripts/check.sh
        run: bash scripts/check.sh
