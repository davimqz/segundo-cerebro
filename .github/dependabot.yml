version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor versões recém-publicadas.
    cooldown:
      default-days: 7
  # Imagens do PostgreSQL e do Redis em infra/banco/compose.yml.
  - package-ecosystem: docker-compose
    directory: /infra/banco
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Dependências do painel (pnpm). Mudanças pequenas agrupadas num PR só.
  - package-ecosystem: npm
    directory: /painel
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencias:
        update-types: [minor, patch]
  # Imagem base do painel (painel/Dockerfile).
  - package-ecosystem: docker
    directory: /painel
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
