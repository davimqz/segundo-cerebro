# Configuração do Redis compartilhado. A senha (requirepass) vem do .env, pelo compose.yml.

# Aceita conexões da rede Docker; a proteção é a senha e a ausência de porta publicada.
bind 0.0.0.0
protected-mode no
port 6379

# Persistência: grava cada escrita no disco (AOF), além dos snapshots.
appendonly yes
appendfsync everysec
dir /data

# Filas não podem perder itens: com a memória cheia, recusa escritas em vez de apagar chaves.
maxmemory 256mb
maxmemory-policy noeviction
