# PostgreSQL e Redis compartilhados pelos serviços (painel, n8n, Paperclip).
# No servidor fica em /opt/asttra/banco/. As senhas vêm do .env ao lado (ver .env.example).
# Antes do primeiro "up": docker network create asttra

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      PAINEL_DB_PASSWORD: ${PAINEL_DB_PASSWORD:?defina no .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?defina no .env}
      PAPERCLIP_DB_PASSWORD: ${PAPERCLIP_DB_PASSWORD:?defina no .env}
    # Ajuste básico para o limite de 1 GB do container.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=100
    # Só no 127.0.0.1: o Docker ignora o UFW.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # No PostgreSQL 18 o volume fica em /var/lib/postgresql (antes era .../data).
      - postgres-dados:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - asttra

  redis:
    image: redis:8.10.3-trixie
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina no .env}
    # A senha vai para um arquivo temporário incluído na config, para não aparecer
    # na lista de processos. Depois o entrypoint oficial roda o Redis como usuário redis.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /run/redis/senha.conf &&
        chown redis:redis /run/redis/senha.conf &&
        exec docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf
        --include /run/redis/senha.conf
    # Sem "ports": só os containers da rede asttra alcançam o Redis.
    volumes:
      - redis-dados:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    tmpfs:
      - /run/redis
    mem_limit: 300m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - asttra

volumes:
  postgres-dados:
  redis-dados:

networks:
  asttra:
    external: true
