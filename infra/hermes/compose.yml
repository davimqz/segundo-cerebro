# Hermes (o agente que conversa pelo Telegram e cria tarefas no Paperclip). Spec 005, ADR 0007.
# No servidor fica em /opt/asttra/hermes/ (cópia desta pasta), com o .env ao lado e os dados
# (memória, sessões, skills, config.yaml e SOUL.md) em ./dados, que entra no backup diário.
# Imagem oficial presa pelo digest (HERMES_IMAGEM). Precisa da rede "asttra" e do Paperclip no ar.
#
# Subir: sudo docker compose up -d --wait   (antes, rode o configurar.sh uma vez)

services:
  hermes:
    image: ${HERMES_IMAGEM:?defina HERMES_IMAGEM no .env}
    command: ["gateway", "run"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixos aqui, para não depender do .env: a API (que o Paperclip chama pelo hermes_gateway)
      # escuta na rede interna "asttra", sem porta publicada no servidor, e exige API_SERVER_KEY.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
    # Sem "ports": nada fica exposto no servidor. Sem "user": a imagem sobe como root só para
    # preparar ./dados e roda o Hermes como o usuário hermes (UID 10000); ela recusa UID fixo.
    # Sem o socket do Docker: o Hermes não tem terminal (ADR 0007).
    volumes:
      - ./dados:/opt/data
      - ./mcp-paperclip:/opt/asttra/mcp-paperclip:ro
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - asttra

networks:
  asttra:
    external: true
